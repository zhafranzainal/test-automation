name: Test Automation Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright:
    name: Playwright E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test-automation repo
        uses: actions/checkout@v4

      - name: Checkout practice-software-testing app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: pst-app
          ref: 2.3

      - name: Patch Angular Docker image
        working-directory: ./pst-app
        run: |
          echo "--- Before patch ---"
          grep -n "^FROM" _docker/ui.docker
          sed -i -E 's/node:20[.0-9]*-alpine/node:22-alpine/g' _docker/ui.docker
          echo "--- After patch ---"
          grep -n "^FROM" _docker/ui.docker

      - name: Start containers
        working-directory: ./pst-app
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        run: |
          docker compose build --no-cache angular-ui
          docker compose up -d --force-recreate

      - name: Sleep for 30 seconds (wait for containers)
        run: sleep 30s

      - name: Ensure Laravel storage directories exist
        working-directory: ./pst-app
        run: |
          docker compose exec -T -u root laravel-api sh -c "
            mkdir -p storage/framework/cache/data \
                     storage/framework/sessions \
                     storage/framework/views \
                     storage/logs \
            && chmod -R 775 storage bootstrap/cache \
            && chown -R www-data:www-data storage bootstrap/cache
          "

      - name: Install Composer dependencies
        working-directory: ./pst-app
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for database to be ready
        working-directory: ./pst-app
        run: |
          echo "Waiting for MariaDB..."
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MariaDB is ready!"
              break
            fi
            echo "Attempt $i/30 - not ready yet, waiting 2s..."
            sleep 2
          done

      - name: Create & Seed database
        working-directory: ./pst-app
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for Angular UI to be ready
        run: |
          echo "Waiting for Angular UI on port 4200..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "Angular UI is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Angular UI failed to start within 5 minutes"
          docker compose -f pst-app/docker-compose.yml logs angular-ui
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: ./playwright
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./playwright
        env:
          CI: true
          WEB_URL: http://localhost:4200
          API_URL: ${{ vars.API_URL }}
        run: npm test

      - name: Show app logs on failure
        if: failure()
        working-directory: ./pst-app
        run: docker compose -f docker-compose.yml logs --tail=300

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            playwright/playwright-report/
            playwright/test-results.json
          retention-days: 30

  newman:
    name: Newman API Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test-automation repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Postman/Newman dependencies
        working-directory: ./postman
        run: npm ci

      - name: Run Newman API tests
        working-directory: ./postman
        run: npm run test:ci

      - name: Upload Newman Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: newman-results-${{ github.run_id }}
          path: |
            postman/newman-report/
          retention-days: 30

  karate:
    name: Karate API Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test-automation repo
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Karate API tests
        working-directory: ./karate
        run: mvn -B test

      - name: Upload Karate Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: karate-results-${{ github.run_id }}
          path: |
            karate/target/karate-reports/
            karate/target/surefire-reports/
          retention-days: 30

  publish-report:
    name: Publish Combined Report
    needs: [playwright, newman, karate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-results-${{ github.run_id }}
          path: downloads/playwright

      - name: Download Newman report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: newman-results-${{ github.run_id }}
          path: downloads/newman

      - name: Download Karate report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: karate-results-${{ github.run_id }}
          path: downloads/karate

      - name: Build combined report site
        run: |
          mkdir -p combined-report/playwright combined-report/newman combined-report/karate

          if [ -d "downloads/playwright/playwright-report" ]; then
            cp -r downloads/playwright/playwright-report/. combined-report/playwright/
          fi

          if [ -f "downloads/newman/report.html" ]; then
            cp downloads/newman/report.html combined-report/newman/index.html
          fi

          if [ -d "downloads/karate/karate-reports" ]; then
            cp -r downloads/karate/karate-reports/. combined-report/karate/
            if [ -f "combined-report/karate/karate-summary.html" ]; then
              cp combined-report/karate/karate-summary.html combined-report/karate/index.html
            fi
          fi

          cat > combined-report/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>Test Automation Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; line-height: 1.6; }
              h1 { margin-bottom: 0.25rem; }
              ul { list-style: none; padding: 0; }
              li { margin: 1rem 0; }
              a {
                display: inline-block;
                padding: 0.75rem 1.25rem;
                border: 1px solid #ccc;
                border-radius: 8px;
                text-decoration: none;
                color: #222;
              }
              a:hover { background: #f4f4f4; }
            </style>
          </head>
          <body>
            <h1>Test Automation Reports</h1>
            <p>Run #${{ github.run_number }} &middot; ${{ github.sha }}</p>
            <ul>
              <li><a href="./playwright/index.html">Playwright E2E Report</a></li>
              <li><a href="./newman/index.html">Newman API Report</a></li>
              <li><a href="./karate/index.html">Karate API Report</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-report

      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
