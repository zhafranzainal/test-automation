name: Playwright Tests

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout test-automation repo
        uses: actions/checkout@v4

      - name: Checkout practice-software-testing app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: pst-app

      - name: Start containers
        working-directory: ./pst-app
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        run: docker compose -f docker-compose.yml up -d --force-recreate

      - name: Sleep for 30 seconds (wait for containers)
        run: sleep 30s

      - name: Install Composer dependencies
        working-directory: ./pst-app
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for database to be ready
        working-directory: ./pst-app
        run: |
          echo "Waiting for MariaDB..."
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MariaDB is ready!"
              break
            fi
            echo "Attempt $i/30 - not ready yet, waiting 2s..."
            sleep 2
          done

      - name: Create & Seed database
        working-directory: ./pst-app
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for Angular UI to be ready
        run: |
          echo "Waiting for Angular UI on port 4200..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "Angular UI is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Angular UI failed to start within 5 minutes"
          docker compose -f pst-app/docker-compose.yml logs angular-ui
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: ./playwright
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./playwright
        env:
          CI: true
          WEB_URL: http://localhost:4200
          API_URL: http://localhost:8091
        run: npx playwright test

      - name: Show app logs on failure
        if: failure()
        working-directory: ./pst-app
        run: docker compose -f docker-compose.yml logs --tail=300

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            playwright/playwright-report/
            playwright/test-results.json
          retention-days: 30

      - name: Setup Pages
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v5

      - name: Upload report to Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright/playwright-report

      - name: Deploy report
        id: deployment
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
