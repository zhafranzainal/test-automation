name: Playwright Tests

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout test-automation repo
        uses: actions/checkout@v4

      - name: Checkout practice-software-testing app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: pst-app

      - name: Start application stack
        working-directory: ./pst-app
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for MariaDB and API containers to be ready
        working-directory: ./pst-app
        run: |
          timeout 180 sh -c 'until docker compose exec -T mariadb mysqladmin ping -h localhost -uroot -proot --silent; do sleep 2; done'
          timeout 180 sh -c 'until docker compose exec -T laravel-api php -v > /dev/null 2>&1; do sleep 2; done'

      - name: Run database migrations and seed
        working-directory: ./pst-app
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Show env and container status
        if: always()
        working-directory: ./pst-app
        run: |
          echo "--- .env contents ---"
          cat .env || echo ".env not found"
          echo "--- container status ---"
          docker compose -f docker-compose.yml ps -a
          echo "--- images built ---"
          docker images | grep pst-app

      - name: Wait for app to be ready
        run: |
          npx --yes wait-on -t 300000 -i 3000 http://localhost:4200 http://localhost:8091

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: ./playwright
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./playwright
        env:
          CI: true
          WEB_URL: http://localhost:4200
          API_URL: http://localhost:8091
        run: npx playwright test

      - name: Show app logs on failure
        if: failure()
        working-directory: ./pst-app
        run: docker compose -f docker-compose.yml logs --tail=300

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            playwright/playwright-report/
            playwright/test-results.json
          retention-days: 30

      - name: Setup Pages
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v5

      - name: Upload report to Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright/playwright-report

      - name: Deploy report
        id: deployment
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
