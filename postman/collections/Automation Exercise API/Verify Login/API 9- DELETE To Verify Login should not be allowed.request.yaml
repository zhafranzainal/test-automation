$kind: http-request
name: "API 9: DELETE To Verify Login should not be allowed"
url: "{{baseUrl}}/verifyLogin"
method: DELETE
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const body = pm.response.json();\r

      \r

      pm.test(\"responseCode is 405\", () => {\r

      \    pm.expect(body.responseCode).to.eql(405);\r

      });\r

      \r

      pm.test(\"message indicates method not supported\", () => {\r

      \    pm.expect(body.message).to.eql(\"This request method is not supported.\");\r

      });"
    language: text/javascript
order: 2000
