$kind: http-request
name: "API 5: POST To Search Product"
url: "{{baseUrl}}/searchProduct"
method: POST
body:
  type: urlencoded
  content:
    search_product: top
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const body = pm.response.json();\r

      \r

      pm.test(\"responseCode is 200\", () => {\r

      \    pm.expect(body.responseCode).to.eql(200);\r

      });\r

      \r

      pm.test(\"products is an array\", () => {\r

      \    pm.expect(Array.isArray(body.products)).to.be.true;\r

      });"
    language: text/javascript
order: 1000
