$kind: http-request
name: "API 12: DELETE METHOD To Delete User Account"
url: "{{baseUrl}}/deleteAccount"
method: DELETE
body:
  type: urlencoded
  content:
    email: "{{testUserEmail}}"
    password: "{{testUserPassword}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const body = pm.response.json();\r

      \r

      pm.test(\"responseCode is 200\", () => {\r

      \    pm.expect(body.responseCode).to.eql(200);\r

      });\r

      \r

      pm.test(\"message confirms account deleted\", () => {\r

      \    pm.expect(body.message).to.eql(\"Account deleted!\");\r

      });"
    language: text/javascript
order: 5000
